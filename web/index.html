<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="KMSAN — نظام نقطة البيع وإدارة المخزون">

  <!-- iOS PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KMSAN">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Android / Generic PWA -->
  <meta name="theme-color" content="#3A3129">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KMSAN — نظام الإدارة ونقطة البيع</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FBF7F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Splash Screen Loader */
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #FBF7F0 0%, #EDE5D8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loading-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(58, 49, 41, 0.15);
      animation: pulseLogo 2s infinite ease-in-out;
    }
    .splash-title {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 700;
      color: #3A3129;
      letter-spacing: 0.5px;
    }
    .splash-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #7D6E63;
    }
    .splash-spinner {
      margin-top: 28px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(58, 49, 41, 0.12);
      border-top-color: #8C6D4F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* iOS Install Guide Prompt */
    #ios-prompt {
      display: none;
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 16px));
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(140, 109, 79, 0.25);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
      z-index: 10000;
      color: #2E2822;
      direction: rtl;
      text-align: right;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #ios-prompt .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    #ios-prompt .prompt-title {
      font-weight: bold;
      font-size: 15px;
      color: #3A3129;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #ios-prompt .prompt-close {
      background: #EFE8DF;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-size: 14px;
      line-height: 26px;
      text-align: center;
      color: #6E5D4F;
    }
    #ios-prompt .prompt-steps {
      font-size: 13px;
      line-height: 1.6;
      color: #4A3E35;
      margin: 0;
      padding: 0 18px 0 0;
    }
    #ios-prompt .prompt-steps li {
      margin-bottom: 6px;
    }
    #ios-prompt .icon-badge {
      display: inline-block;
      background: #F0EAE1;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
      color: #3A3129;
      margin: 0 3px;
      font-size: 12px;
    }
    .down-arrow {
      text-align: center;
      margin-top: 8px;
      font-size: 18px;
      animation: bounce 1.2s infinite;
      color: #8C6D4F;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(6px); }
      60% { transform: translateY(3px); }
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="loading-splash">
    <img src="icons/Icon-192.png" alt="KMSAN" class="splash-logo">
    <div class="splash-title">KMSAN</div>
    <div class="splash-sub">نظام نقطة البيع وإدارة المخزون</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- iOS Install Helper Sheet -->
  <div id="ios-prompt">
    <div class="prompt-header">
      <div class="prompt-title">
        <span>📲</span>
        <span>تثبيت KMSAN على الآيفون</span>
      </div>
      <button class="prompt-close" onclick="dismissIosPrompt()">✕</button>
    </div>
    <ol class="prompt-steps">
      <li>اضغط زر المشاركة <span class="icon-badge">⎋ Share</span> أسفل المتصفح</li>
      <li>انزل للأسفل واختر <span class="icon-badge">➕ إضافة إلى الشاشة الرئيسية</span></li>
      <li>اضغط <span class="icon-badge">إضافة (Add)</span> بالأعلى ليصبح التطبيق على هاتفك مباشرة</li>
    </ol>
    <div class="down-arrow">▼</div>
  </div>

  <script>
    // Dismiss iOS prompt
    function dismissIosPrompt() {
      var el = document.getElementById('ios-prompt');
      if (el) el.style.display = 'none';
      sessionStorage.setItem('ios_prompt_dismissed', 'true');
    }

    // Detect iOS Safari and show install guide if not already standalone
    window.addEventListener('DOMContentLoaded', function() {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      var isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      var dismissed = sessionStorage.getItem('ios_prompt_dismissed') === 'true';

      if (isIOS && !isStandalone && !dismissed) {
        setTimeout(function() {
          var prompt = document.getElementById('ios-prompt');
          if (prompt) prompt.style.display = 'block';
        }, 1500);
      }
    });

    // Hide splash screen when Flutter renders first frame
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function() { splash.remove(); }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
